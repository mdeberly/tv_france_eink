name: Android

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Générer les captures d'écran (docs/screenshots)"
        type: boolean
        default: false
      device:
        description: "Format d'écran des captures (vide = Kompakt / téléphone ; hibreak-s)"
        type: string
        default: ""
      release:
        description: "Publier une release GitHub avec l'APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Clé TMDB (rubrique Netflix), facultative : intégrée à l'APK si le secret existe,
      # sinon elle se saisit dans l'application au premier usage.
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: chmod +x gradlew && ./gradlew :app:testEinkDebugUnitTest --tests "fr.papertv.eink.XmltvTest"

      - name: APK release
        run: ./gradlew :app:assembleRelease

      - name: Captures d'écran
        if: ${{ inputs.screenshots }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/xmltv && cd /tmp/xmltv
          curl -sSfL -o tnt.zip https://xmltvfr.fr/xmltv/xmltv_tnt.zip && unzip -o -q tnt.zip
          curl -sSfL -o fr.zip https://xmltvfr.fr/xmltv/xmltv_fr.zip && unzip -o -q fr.zip
          cd "$GITHUB_WORKSPACE"
          ./gradlew :app:testEinkDebugUnitTest :app:testColorDebugUnitTest --tests 'fr.papertv.eink.ScreenshotTest' \
            -Proborazzi.test.record=true \
            -Ppapertv.tnt=/tmp/xmltv/xmltv_tnt.xml -Ppapertv.fr=/tmp/xmltv/xmltv_fr.xml \
            -Ppapertv.today=$(TZ=Europe/Paris date +%F) -Ppapertv.device="${{ inputs.device }}"
          for d in app/build/screenshots/*; do rm -rf "docs/screenshots/$(basename "$d")"; done
          mkdir -p docs/screenshots && cp -r app/build/screenshots/* docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Mise à jour des captures d'écran" || echo "Pas de changement"
          git push

      - name: APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/eink/release/app-eink-release.apk PaperTV-EInk.apk
          cp app/build/outputs/apk/color/release/app-color-release.apk PaperTV-Color.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in PaperTV-EInk.apk PaperTV-Color.apk; do
            "$BT/apksigner" verify --print-certs "$f" | grep -E "SHA-256" || true
            "$BT/aapt2" dump badging "$f" | grep -E "^package"
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PaperTV-EInk
          path: PaperTV-EInk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperTV-Color
          path: PaperTV-Color.apk

      - name: Release GitHub
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Paper TV v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            PaperTV-EInk.apk
            PaperTV-Color.apk
